<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Voice2Text</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="logo">🎙️</div>

      <h1>Voice2Text</h1>

      <p>
        အသံကို စာသားအဖြစ် ပြောင်းပေးမယ့် App
      </p>
    </header>


    <main class="card">

      <!-- Language -->
      <div class="top-bar">

        <select id="language">

          <option value="my-MM">
            🇲🇲 မြန်မာ
          </option>

          <option value="en-US">
            🇺🇸 English
          </option>

          <option value="th-TH">
            🇹🇭 Thai
          </option>

        </select>

        <span id="wordCount">
          0 words
        </span>

      </div>


      <!-- Text -->
      <textarea
        id="text"
        placeholder="🎤 Start Recording ကိုနှိပ်ပြီး စကားပြောပါ..."
      ></textarea>


      <!-- Buttons -->
      <div class="buttons">

        <button
          id="startBtn"
          class="start"
        >
          🎙️ Start Recording
        </button>


        <button
          id="stopBtn"
          class="stop"
          disabled
        >
          ⏹️ Stop
        </button>


        <button
          id="copyBtn"
          class="copy"
        >
          📋 Copy
        </button>


        <button
          id="downloadBtn"
        >
          ⬇️ TXT
        </button>


        <button
          id="clearBtn"
        >
          🗑️ Clear
        </button>

      </div>


      <!-- Audio -->
      <div class="audio-box">

        <h3>🎧 Audio File</h3>

        <p>
          MP3 / WAV / M4A ဖိုင်ကို ရွေးနိုင်ပါတယ်။
        </p>

        <input
          type="file"
          id="audioFile"
          accept="audio/*"
        >

        <audio
          id="audio"
          controls
          hidden
        ></audio>

        <small>
          Audio file transcription အတွက်
          နောက်ပိုင်းမှာ Speech-to-Text API ချိတ်နိုင်ပါတယ်။
        </small>

      </div>


      <!-- Status -->
      <div
        id="status"
        class="status"
      >
        Ready — Start Recording ကိုနှိပ်ပါ။
      </div>

    </main>

  </div>


  <script src="app.js"></script>

</body>
</html>
